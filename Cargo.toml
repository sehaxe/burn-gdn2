[package]
name = "burn-gdn2"
version = "0.1.4"
edition = "2021"
license = "AGPL-3.0"
description = "Gated DeltaNet 2 — linear recurrent token mixer with channel-wise erase/write gates"
repository = "https://github.com/sehaxe/burn-gdn2"
homepage = "https://github.com/sehaxe/burn-gdn2"
keywords = ["burn", "gdn2", "linear-attention", "recurrent", "transformer"]

[features]
default = ["std"]
std = ["burn/std", "burn-tensor/std"]
autodiff = ["burn/autodiff"]
cuda = ["dep:burn-cuda"]

[dependencies]
burn = { version = "0.21", default-features = false }
burn-nn = "0.21"
burn-tensor = "0.21"
burn-cuda = { version = "0.21", optional = true, default-features = false }

[dev-dependencies]
burn-ndarray = { version = "0.21", features = ["blas-openblas"] }
burn-cuda = { version = "0.21" }
burn = { version = "0.21", features = ["ndarray", "autodiff", "cuda"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
